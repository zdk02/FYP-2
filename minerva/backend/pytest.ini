[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Legacy script-style tests in tests/ root use a custom hand-rolled
# runner (see test_core_services.py). They predate this pytest setup
# and are still valid — run them directly with `python -m tests.<name>`.
# We just keep them out of pytest's auto-discovery so `pytest tests/`
# only sees the structured suites under unit/, integration/, etc.
addopts = -v --tb=short --strict-markers
    --ignore=tests/test_core_services.py
    --ignore=tests/test_analytics_e2e.py
    --ignore=tests/test_pro_attacks_e2e.py
    --ignore=tests/test_refined_attacks_smoke.py
    --ignore=tests/test_report_edit.py
markers =
    unit: pure-function unit tests (no DB, no network)
    integration: API + DB integration tests
    component: single-component tests
    system: end-to-end system tests
    security: security-focused tests
    performance: performance / latency tests
    stress: stress / load tests
    smoke: quick health-check tests
